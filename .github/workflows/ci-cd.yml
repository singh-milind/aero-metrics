name: Aero Metrics CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            uv run --with pytest pytest
          else
            echo "No tests directory found. Skipping tests."
          fi
  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build API image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/aero-metrics-api:latest \
            -f Dockerfile .

      - name: Push API image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/aero-metrics-api:latest

      - name: Build Airflow image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/aero-metrics-airflow:latest \
            -f airflow/Dockerfile .

      - name: Push Airflow image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/aero-metrics-airflow:latest