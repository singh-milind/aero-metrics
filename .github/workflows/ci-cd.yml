name: Aero Metrics CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            uv run --with pytest pytest
          else
            echo "No tests directory found. Skipping tests."
          fi

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build API image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/aero-metrics-api:${{ github.sha }} \
            -f Dockerfile .

      - name: Push API image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/aero-metrics-api:${{ github.sha }}

      - name: Build Frontend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/aero-metrics-frontend:${{ github.sha }} \
            -f frontend/Dockerfile .

      - name: Push Frontend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/aero-metrics-frontend:${{ github.sha }}

  azure-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          API_CONTAINER: ${{ secrets.AZURE_API_CONTAINER_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          az containerapp update --name "$API_CONTAINER" --resource-group "$RESOURCE_GROUP" --image "$DOCKERHUB_USERNAME/aero-metrics-api:${{ github.sha }}"

      - name: Deploy Frontend
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          FRONTEND_CONTAINER: ${{ secrets.AZURE_FRONTEND_CONTAINER_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          az containerapp update --name "$FRONTEND_CONTAINER" --resource-group "$RESOURCE_GROUP" --image "$DOCKERHUB_USERNAME/aero-metrics-frontend:${{ github.sha }}"