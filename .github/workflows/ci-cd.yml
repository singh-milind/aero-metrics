name: Aero Metrics CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            uv run --with pytest pytest
          else
            echo "No tests directory found. Skipping tests."
          fi