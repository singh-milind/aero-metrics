      - models/predictor/pm10/pm10_global_shap_values.pkl
      - models/predictor/pm10/pm10_global_shap_feature_values.pkl
    metrics:
      - metrics/predictor/pm10/predictor_model_metrics.json


  forecaster_train_pm25_model_t:
